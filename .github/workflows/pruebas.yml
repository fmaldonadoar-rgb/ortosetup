# Pruebas automáticas en Windows (y Linux) en cada cambio subido a GitHub.
# Es la evidencia objetiva de que el código funciona en Windows.
name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Reporte de entorno
        run: python scripts/verificar_entorno.py
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
