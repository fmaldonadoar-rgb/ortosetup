[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ortosetup"
version = "0.1.0"
description = "Software experimental de setup ortodóncico 3D (Fase 1). No apto para uso clínico."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "trimesh>=4.0",
  "vtk>=9.3",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ortosetup = "ortosetup.app.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
